<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castiva - Award Shows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            castiva: {
              purple: '#A128FF',
              lightPurple: '#C86BFF',
              dark: '#111827',
              gray: '#4B5563',
              lightBg: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      color: #111827;
      overflow-x: hidden;
    }
    .scribble-underline {
      position: relative;
      display: inline-block;
    }
    .scribble-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -12px;
      width: 100%;
      height: 16px;
      background-image: url('sketch-line.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    .btn-login-gradient {
      background: linear-gradient(135deg, #A833FF 0%, #7C00FF 100%);
      box-shadow: 0 4px 15px rgba(168, 51, 255, 0.35);
    }
    .btn-login-gradient:hover {
      background: linear-gradient(135deg, #B54CFF 0%, #8D1AFF 100%);
      box-shadow: 0 6px 20px rgba(168, 51, 255, 0.5);
    }
    <!-- @import "../components/header/header.css" -->
    <!-- @import "../components/scrolling-banner/scrolling-banner.css" -->
  </style>
</head>
<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">
  <!-- @import "../components/header/header.html" -->
  <section class="pt-36 pb-32 flex flex-col items-center text-center relative overflow-hidden bg-cover bg-top text-slate-900" style="background-image: url('hero-gradient-small.png');">
    <div class="absolute top-10 left-1/4 w-72 h-72 bg-purple-300/20 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-indigo-300/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 right-1/3 w-48 h-48 bg-pink-300/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="max-w-7xl mx-auto px-6 relative z-10 text-center space-y-6">
      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-[1.15]">
        <span class="gs-hero-reveal inline-block">Award</span>
        <span class="gs-hero-reveal font-serif italic font-medium text-purple-600 text-5xl sm:text-7xl scribble-underline inline-block" style="--gs-delay: 0.15s">Shows</span>
      </h1>
      <p class="gs-hero-reveal text-slate-600 max-w-2xl mx-auto text-sm sm:text-lg" style="--gs-delay: 0.3s">Celebrating excellence in talent and casting through prestigious award ceremonies.</p>
    </div>
  </section>
  <!-- @import "../components/scrolling-banner/scrolling-banner.html" -->
  <section class="py-20 px-6 max-w-6xl mx-auto">
    <div class="space-y-8">
      <div id="award-shows-loading" class="flex justify-center py-10">
        <div class="flex items-center gap-3 text-slate-500">
          <svg class="animate-spin h-6 w-6 text-purple-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-base font-medium">Loading award shows...</span>
        </div>
      </div>

      <div id="award-shows-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>

      <div id="award-shows-error" class="hidden text-center py-10">
        <p class="text-slate-500 text-base">Unable to load award shows at this time.</p>
        <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors">Retry</button>
      </div>
    </div>
  </section>
  <!-- @import "../components/footer/footer.html" -->
  <script>
    <!-- @import "../components/header/header.js" -->
  </script>
  <script>
    <!-- @import "../components/scrolling-banner/scrolling-banner.js" -->
  </script>
  <script>
    function buildContentCard(page) {
      var card = document.createElement('a');
      card.href = 'page-post.html?category=award-shows&slug=' + encodeURIComponent(page.slug || page.id);
      card.className = 'block bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden hover:shadow-md transition-all duration-300 group';

      var imgWrapper = document.createElement('div');
      imgWrapper.className = 'aspect-[2/1] bg-slate-100 overflow-hidden';

      if (page.imageUrl) {
        var img = document.createElement('img');
        img.className = 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-500';
        img.src = page.imageUrl;
        img.alt = page.title;
        img.loading = 'lazy';
        img.onerror = function () {
          this.style.display = 'none';
        };
        imgWrapper.appendChild(img);
      }

      var body = document.createElement('div');
      body.className = 'p-6 space-y-3 rounded-t-[2.5rem] -mt-8 relative z-10 bg-white';

      var titleEl = document.createElement('h3');
      titleEl.className = 'font-bold text-slate-900 text-lg leading-snug group-hover:text-purple-600 transition-colors';
      titleEl.textContent = page.title;
      body.appendChild(titleEl);

      if (page.body) {
        var excerptEl = document.createElement('p');
        excerptEl.className = 'text-slate-500 text-sm leading-relaxed line-clamp-3';
        excerptEl.textContent = page.body.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
        body.appendChild(excerptEl);
      }

      var dateEl = document.createElement('p');
      dateEl.className = 'text-xs text-slate-400 font-medium';
      if (page.publishedAt) {
        var d = new Date(page.publishedAt);
        dateEl.textContent = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      }
      body.appendChild(dateEl);

      card.appendChild(imgWrapper);
      card.appendChild(body);

      return card;
    }

    document.addEventListener('DOMContentLoaded', function () {
      var loading = document.getElementById('award-shows-loading');
      var list = document.getElementById('award-shows-list');
      var errorEl = document.getElementById('award-shows-error');
      if (!list) return;

      fetch('https://backend.castiva.in/api/v1/pages?category=award-shows&_=' + Date.now())
        .then(function (res) { return res.json(); })
        .then(function (json) {
          loading.style.display = 'none';
          if (!json.success || !Array.isArray(json.data)) {
            throw new Error('Invalid response');
          }
          if (json.data.length === 0) {
            list.innerHTML = '<div class="sm:col-span-2 text-center py-12"><p class="text-slate-500">No award shows available at the moment.</p></div>';
            return;
          }
          json.data.forEach(function (page) {
            list.appendChild(buildContentCard(page));
          });
        })
        .catch(function () {
          loading.style.display = 'none';
          errorEl.classList.remove('hidden');
        });
    });
  </script>
  <script>
    if (window.gsap) {
      gsap.fromTo('.gs-hero-reveal',
        { opacity: 0, y: 35, filter: 'blur(12px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1, stagger: 0.2, ease: 'power3.out', delay: 0.3 }
      );
    }
    if (window.gsap && window.ScrollTrigger) {
      gsap.registerPlugin(ScrollTrigger);
      gsap.fromTo('.gs-about-features-title',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out', scrollTrigger: { trigger: '.gs-about-features-title', start: 'top 85%' } }
      );
      gsap.fromTo('.gs-vision-reveal',
        { opacity: 0, y: 25, filter: 'blur(6px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, stagger: 0.12, ease: 'power2.out', scrollTrigger: { trigger: '.gs-vision-reveal', start: 'top 85%' } }
      );
    }
  </script>
</body>
</html>
