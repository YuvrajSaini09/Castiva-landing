<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castiva - Career</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            castiva: {
              purple: '#A128FF',
              lightPurple: '#C86BFF',
              dark: '#111827',
              gray: '#4B5563',
              lightBg: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      color: #111827;
      overflow-x: hidden;
    }
    .scribble-underline {
      position: relative;
      display: inline-block;
    }
    .scribble-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -12px;
      width: 100%;
      height: 16px;
      background-image: url('sketch-line.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    .btn-login-gradient {
      background: linear-gradient(135deg, #A833FF 0%, #7C00FF 100%);
      box-shadow: 0 4px 15px rgba(168, 51, 255, 0.35);
    }
    .btn-login-gradient:hover {
      background: linear-gradient(135deg, #B54CFF 0%, #8D1AFF 100%);
      box-shadow: 0 6px 20px rgba(168, 51, 255, 0.5);
    }
    <!-- @import "../components/header/header.css" -->
    <!-- @import "../components/scrolling-banner/scrolling-banner.css" -->
  </style>
</head>
<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">
  <!-- @import "../components/header/header.html" -->
  <section class="pt-36 pb-32 flex flex-col items-center text-center relative overflow-hidden bg-cover bg-top text-slate-900" style="background-image: url('hero-gradient-small.png');">
    <div class="absolute top-10 left-1/4 w-72 h-72 bg-purple-300/20 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-indigo-300/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 right-1/3 w-48 h-48 bg-pink-300/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="max-w-7xl mx-auto px-6 relative z-10 text-center space-y-6">
      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-[1.15]">
        <span class="gs-hero-reveal inline-block">Join</span>
        <span class="gs-hero-reveal font-serif italic font-medium text-purple-600 text-5xl sm:text-7xl scribble-underline inline-block" style="--gs-delay: 0.15s">Castiva</span>
      </h1>
      <p class="gs-hero-reveal text-slate-600 max-w-2xl mx-auto text-sm sm:text-lg" style="--gs-delay: 0.3s">Explore career opportunities and be part of India's 1st AI Enabled Global Casting Ecosystem.</p>
    </div>
  </section>
  <!-- @import "../components/scrolling-banner/scrolling-banner.html" -->
  <section class="py-16 sm:py-20 px-6 max-w-5xl mx-auto">
    <div class="text-center space-y-8">
      <div class="gs-about-features-title">
        <span class="text-xs font-semibold text-purple-600 bg-purple-50 px-4 py-2 rounded-full uppercase tracking-wider">Coming Soon</span>
        <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mt-4 leading-tight">We're <span class="text-purple-600">Hiring</span></h2>
      </div>
      <p class="gs-vision-reveal text-slate-500 max-w-xl mx-auto text-base sm:text-lg leading-relaxed">Career opportunities at Castiva are currently being curated. Check back soon for exciting roles in tech, creative, and operations.</p>
      <div class="gs-about-card inline-flex items-center gap-3 bg-purple-50 border border-purple-100 rounded-full px-6 py-3 text-purple-700 font-semibold text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        careers@castiva.in
      </div>
    </div>
  </section>
  <!-- @import "../components/footer/footer.html" -->
  <script>
    <!-- @import "../components/header/header.js" -->
  </script>
  <script>
    <!-- @import "../components/scrolling-banner/scrolling-banner.js" -->
  </script>
  <script>
    if (window.gsap) {
      gsap.fromTo('.gs-hero-reveal',
        { opacity: 0, y: 35, filter: 'blur(12px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1, stagger: 0.2, ease: 'power3.out', delay: 0.3 }
      );
    }
    if (window.gsap && window.ScrollTrigger) {
      gsap.registerPlugin(ScrollTrigger);
      gsap.fromTo('.gs-about-features-title',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out', scrollTrigger: { trigger: '.gs-about-features-title', start: 'top 85%' } }
      );
      gsap.fromTo('.gs-vision-reveal',
        { opacity: 0, y: 25, filter: 'blur(6px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, stagger: 0.12, ease: 'power2.out', scrollTrigger: { trigger: '.gs-vision-reveal', start: 'top 85%' } }
      );
      gsap.fromTo('.gs-about-card',
        { opacity: 0, y: 40, filter: 'blur(4px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power2.out', scrollTrigger: { trigger: '.gs-about-card', start: 'top 85%' } }
      );
    }
  </script>
</body>
</html>
