<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castiva - Blog Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            castiva: { purple: '#A128FF', lightPurple: '#C86BFF', dark: '#111827', gray: '#4B5563', lightBg: '#FFFFFF' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #ffffff; min-height: 100vh; color: #111827; overflow-x: hidden; }
    .blog-content h1 { font-size: 1.75rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #0f172a; }
    .blog-content h2 { font-size: 1.375rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #0f172a; }
    .blog-content h3 { font-size: 1.125rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #0f172a; }
    .blog-content p { margin-bottom: 1rem; line-height: 1.75; color: #334155; }
    .blog-content ul, .blog-content ol { margin-bottom: 1rem; padding-left: 1.5rem; }
    .blog-content li { margin-bottom: 0.375rem; line-height: 1.7; color: #334155; }
    .blog-content strong { font-weight: 700; color: #0f172a; }
    .blog-content blockquote { border-left: 4px solid #a128ff; padding-left: 1rem; margin: 1rem 0; color: #475569; font-style: italic; }
    <!-- @import "../components/header/header.css" -->
  </style>
</head>
<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">

  <!-- @import "../components/header/header.html" -->

  <!-- Loading & Error -->
  <section class="pt-14 px-6 max-w-3xl mx-auto">
    <div id="blog-post-loading" class="text-center py-20">
      <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
      <p class="text-slate-500 mt-4">Loading article...</p>
    </div>
    <div id="blog-post-error" class="text-center py-16 hidden">
      <p class="text-slate-500">Failed to load article.</p>
      <a href="blog.html" class="mt-4 inline-block px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors text-sm">Back to Blogs</a>
    </div>
  </section>

  <!-- Blog Post Content -->
  <article id="blog-post-article" class="hidden pt-14">
    <div class="w-full max-h-[400px] overflow-hidden bg-slate-100 relative">
      <a href="blog.html" class="absolute top-4 left-4 z-10 inline-flex items-center gap-1.5 text-xs text-slate-600 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full hover:bg-white transition-colors font-medium shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Back
      </a>
      <img id="blog-post-cover" class="w-full h-full object-cover" src="" alt="">
    </div>
    <div class="max-w-3xl mx-auto px-6 py-10">
      <div id="blog-post-tags" class="flex flex-wrap gap-2 mb-4"></div>
      <h1 id="blog-post-title" class="text-2xl sm:text-4xl font-extrabold text-slate-900 leading-tight mb-3"></h1>
      <p id="blog-post-date" class="text-sm text-slate-400 font-medium mb-8"></p>
      <div id="blog-post-content" class="blog-content"></div>
    </div>
  </article>

  <!-- @import "../components/footer/footer.html" -->

  <script>
    <!-- @import "../components/header/header.js" -->
  </script>

  <script>
    var apiBase = 'https://backend.castiva.in/api/v1';

    function renderMarkdown(md) {
      var html = md
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      var lines = html.split('\n');
      var out = [], inList = false, inOList = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var liMatch = line.match(/^[-*] (.+)/);
        var oliMatch = line.match(/^\d+\.\s+(.+)/);
        var isH = /^<h[123]>/.test(line);
        if (liMatch) {
          if (inOList) { out.push('</ol>'); inOList = false; }
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push('<li>' + liMatch[1] + '</li>');
        } else if (oliMatch) {
          if (inList) { out.push('</ul>'); inList = false; }
          if (!inOList) { out.push('<ol>'); inOList = true; }
          out.push('<li>' + oliMatch[1] + '</li>');
        } else if (isH) {
          if (inList) { out.push('</ul>'); inList = false; }
          if (inOList) { out.push('</ol>'); inOList = false; }
          out.push(line);
        } else if (line.trim() === '') {
          if (inList) { out.push('</ul>'); inList = false; }
          if (inOList) { out.push('</ol>'); inOList = false; }
        } else {
          if (inList) { out.push('</ul>'); inList = false; }
          if (inOList) { out.push('</ol>'); inOList = false; }
          out.push('<p>' + line + '</p>');
        }
      }
      if (inList) out.push('</ul>');
      if (inOList) out.push('</ol>');
      return out.join('\n');
    }

    document.addEventListener('DOMContentLoaded', function () {
      var loading = document.getElementById('blog-post-loading');
      var errorEl = document.getElementById('blog-post-error');
      var article = document.getElementById('blog-post-article');

      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      if (!id) {
        loading.style.display = 'none';
        errorEl.classList.remove('hidden');
        errorEl.querySelector('p').textContent = 'No article specified.';
        return;
      }

      fetch(apiBase + '/blog?_=' + Date.now())
        .then(function (res) { return res.json(); })
        .then(function (json) {
          if (!json.success || !Array.isArray(json.data)) throw new Error('Invalid response');

          var posts = json.data.filter(function (p) { return p.status === 'published'; });
          var post = posts.find(function (p) { return (p.slug === id) || (p._id === id) || (p.slug && id.indexOf(p.slug) !== -1); });

          if (!post) {
            loading.style.display = 'none';
            errorEl.classList.remove('hidden');
            errorEl.querySelector('p').textContent = 'Article not found.';
            return;
          }

          document.title = post.title + ' - Castiva';

          if (post.coverImageUrl) {
            document.getElementById('blog-post-cover').src = post.coverImageUrl;
            document.getElementById('blog-post-cover').alt = post.title;
          }

          var tags = document.getElementById('blog-post-tags');
          if (post.tags && post.tags.length > 0) {
            post.tags.forEach(function (tag) {
              var el = document.createElement('span');
              el.className = 'text-xs font-semibold text-purple-600 bg-purple-50 px-2.5 py-1 rounded-full';
              el.textContent = tag;
              tags.appendChild(el);
            });
          } else {
            tags.style.display = 'none';
          }

          document.getElementById('blog-post-title').textContent = post.title;

          if (post.publishedAt) {
            var d = new Date(post.publishedAt);
            document.getElementById('blog-post-date').textContent = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          }

          var contentHtml = renderMarkdown(post.content || '');
          contentHtml = contentHtml.replace(/^<h1[^>]*>.*?<\/h1>/, '');
          document.getElementById('blog-post-content').innerHTML = contentHtml;

          loading.style.display = 'none';
          article.classList.remove('hidden');
        })
        .catch(function (err) {
          console.error('Blog post fetch error:', err);
          loading.style.display = 'none';
          errorEl.classList.remove('hidden');
        });
    });
  </script>
</body>
</html>
