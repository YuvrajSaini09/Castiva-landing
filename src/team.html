<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castiva - Our Team</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- GSAP -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            castiva: {
              purple: '#A128FF',
              lightPurple: '#C86BFF',
              dark: '#111827',
              gray: '#4B5563',
              lightBg: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      color: #111827;
      overflow-x: hidden;
    }
    
    .scribble-underline {
      position: relative;
      display: inline-block;
    }
    
    .scribble-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -12px;
      width: 100%;
      height: 16px;
      background-image: url('sketch-line.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    
    .btn-login-gradient {
      background: linear-gradient(135deg, #A833FF 0%, #7C00FF 100%);
      box-shadow: 0 4px 15px rgba(168, 51, 255, 0.35);
    }
    
    .btn-login-gradient:hover {
      background: linear-gradient(135deg, #B54CFF 0%, #8D1AFF 100%);
      box-shadow: 0 6px 20px rgba(168, 51, 255, 0.5);
    }

    /* Header Styles */
    <!-- @import "../components/header/header.css" -->

    /* Scrolling Banner Styles */
    <!-- @import "../components/scrolling-banner/scrolling-banner.css" -->
  </style>
</head>
<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">

  <!-- Shared Header Component -->
  <!-- @import "../components/header/header.html" -->
  
  <!-- Hero Section -->
  <section class="pt-36 pb-32 flex flex-col items-center text-center relative overflow-hidden bg-cover bg-top text-slate-900" style="background-image: url('hero-gradient-small.png');">
    <div class="max-w-7xl mx-auto px-6 relative z-10 text-center space-y-4">
      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight">
        Meet Our <span class="font-serif italic font-medium text-purple-600 text-5xl sm:text-7xl scribble-underline">Team</span>
      </h1>
      <p class="text-slate-600 max-w-xl mx-auto text-sm sm:text-lg">The builders, technologists, and industry experts pioneering weightless casting matchmaking.</p>
    </div>
  </section>

  <!-- @import "../components/scrolling-banner/scrolling-banner.html" -->

  <!-- Team Grid -->
  <section class="py-20 px-6 max-w-6xl mx-auto">
    <div class="space-y-12">
      
      <div class="text-center">
        <h2 class="text-3xl font-extrabold text-slate-900">Leadership Team</h2>
      </div>

      <div id="team-loading" class="text-center py-20">
        <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
        <p class="text-slate-500 mt-4">Loading team...</p>
      </div>

      <div id="team-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>

    </div>
  </section>

  <!-- Shared Footer Component -->
  <!-- @import "../components/footer/footer.html" -->

  <!-- Header Script -->
  <script>
    <!-- @import "../components/header/header.js" -->
  </script>

  <!-- Scrolling Banner Script -->
  <script>
    <!-- @import "../components/scrolling-banner/scrolling-banner.js" -->
  </script>

  <!-- Team Data Script -->
  <script>
    const apiBase = 'https://backend.castiva.in/api/v1';

    function createFallbackEl(name) {
      const el = document.createElement('div');
      el.className = 'w-full h-full flex items-center justify-center text-white font-bold text-3xl bg-purple-600';
      el.textContent = name.charAt(0).toUpperCase();
      return el;
    }

    function buildMemberCard(member) {
      const card = document.createElement('div');
      card.className = 'bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4 hover:shadow-md transition-all duration-300';

      const imgWrapper = document.createElement('div');
      imgWrapper.className = 'aspect-square bg-slate-100 rounded-2xl overflow-hidden flex items-center justify-center text-slate-400 font-semibold text-lg';

      if (member.imageUrl) {
        const img = document.createElement('img');
        img.className = 'w-full h-full object-cover';
        img.src = member.imageUrl;
        img.alt = member.name;
        img.loading = 'lazy';
        img.onerror = function () {
          img.style.display = 'none';
          imgWrapper.appendChild(createFallbackEl(member.name));
        };
        imgWrapper.appendChild(img);
      } else {
        imgWrapper.appendChild(createFallbackEl(member.name));
      }

      const info = document.createElement('div');
      const nameEl = document.createElement('h4');
      nameEl.className = 'font-extrabold text-slate-900 text-lg';
      nameEl.textContent = member.name;

      const desigEl = document.createElement('p');
      desigEl.className = 'text-purple-600 text-sm font-semibold';
      desigEl.textContent = member.designation;

      info.appendChild(nameEl);
      info.appendChild(desigEl);

      card.appendChild(imgWrapper);
      card.appendChild(info);
      return card;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const loading = document.getElementById('team-loading');
      const grid = document.getElementById('team-grid');

      try {
        const res = await fetch(apiBase + '/team');
        const json = await res.json();

        if (json.success && Array.isArray(json.data)) {
          json.data.sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
          json.data.forEach(member => {
            grid.appendChild(buildMemberCard(member));
          });
        }
      } catch (err) {
        console.error('Failed to load team:', err);
        grid.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-slate-500">Failed to load team. Please try again later.</p></div>';
      } finally {
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
