<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castiva - Auditions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            castiva: {
              purple: '#A128FF',
              lightPurple: '#C86BFF',
              dark: '#111827',
              gray: '#4B5563',
              lightBg: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      color: #111827;
      overflow-x: hidden;
    }
    .scribble-underline {
      position: relative;
      display: inline-block;
    }
    .scribble-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -12px;
      width: 100%;
      height: 16px;
      background-image: url('sketch-line.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    .btn-login-gradient {
      background: linear-gradient(135deg, #A833FF 0%, #7C00FF 100%);
      box-shadow: 0 4px 15px rgba(168, 51, 255, 0.35);
    }
    .btn-login-gradient:hover {
      background: linear-gradient(135deg, #B54CFF 0%, #8D1AFF 100%);
      box-shadow: 0 6px 20px rgba(168, 51, 255, 0.5);
    }
    <!-- @import "../components/header/header.css" -->
    <!-- @import "../components/scrolling-banner/scrolling-banner.css" -->
  </style>
</head>
<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">
  <!-- @import "../components/header/header.html" -->
  <section class="pt-36 pb-32 flex flex-col items-center text-center relative overflow-hidden bg-cover bg-top text-slate-900" style="background-image: url('hero-gradient-small.png');">
    <div class="absolute top-10 left-1/4 w-72 h-72 bg-purple-300/20 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-indigo-300/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 right-1/3 w-48 h-48 bg-pink-300/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="max-w-7xl mx-auto px-6 relative z-10 text-center space-y-6">
      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-[1.15]">
        <span class="gs-hero-reveal inline-block">Open</span>
        <span class="gs-hero-reveal font-serif italic font-medium text-purple-600 text-5xl sm:text-7xl scribble-underline inline-block" style="--gs-delay: 0.15s">Auditions</span>
      </h1>
      <p class="gs-hero-reveal text-slate-600 max-w-2xl mx-auto text-sm sm:text-lg" style="--gs-delay: 0.3s">Browse live audition opportunities and take the next step in your casting career.</p>
    </div>
  </section>
  <!-- @import "../components/scrolling-banner/scrolling-banner.html" -->
  <section class="py-16 sm:py-20 px-6 max-w-6xl mx-auto">
    <div id="auditions-loading" class="text-center py-20">
      <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
      <p class="text-slate-500 mt-4">Loading auditions...</p>
    </div>
    <div id="auditions-error" class="text-center py-16 hidden">
      <p class="text-slate-500">Failed to load auditions.</p>
      <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors text-sm">Retry</button>
    </div>
    <div id="auditions-empty" class="text-center py-16 hidden">
      <p class="text-slate-500">No live auditions available right now. Check back soon.</p>
    </div>
    <div id="auditions-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>
  <!-- @import "../components/footer/footer.html" -->
  <script>
    <!-- @import "../components/header/header.js" -->
  </script>
  <script>
    <!-- @import "../components/scrolling-banner/scrolling-banner.js" -->
  </script>
  <script>
    (function() {
      var apiBase = 'https://backend.castiva.in/api/v1';
      var loading = document.getElementById('auditions-loading');
      var errorEl = document.getElementById('auditions-error');
      var emptyEl = document.getElementById('auditions-empty');
      var grid = document.getElementById('auditions-grid');

      function formatPaise(paise) {
        if (!paise) return null;
        var num = paise / 100;
        if (num >= 1000) {
          return '\u20B9' + num.toLocaleString('en-IN');
        }
        return '\u20B9' + num;
      }

      function buildCard(job) {
        var recruiter = job.recruiter?.recruiterProfile;
        var companyName = recruiter?.companyName || '';
        var logoUrl = recruiter?.companyLogoUrl || '';
        var city = job.locationCity || '';
        var state = job.locationState || '';
        var location = city + (city && state ? ', ' : '') + state;
        var workMode = job.workMode ? job.workMode.charAt(0).toUpperCase() + job.workMode.slice(1) : '';
        var budgetLabel = '';
        if (job.budgetType === 'negotiable') {
          budgetLabel = 'Negotiable';
        } else if (job.budgetMinPaise || job.budgetMaxPaise) {
          var min = formatPaise(job.budgetMinPaise);
          var max = formatPaise(job.budgetMaxPaise);
          budgetLabel = (min || '') + ' - ' + (max || '');
        }

        var ageRange = '';
        if (job.ageMin || job.ageMax) {
          ageRange = (job.ageMin || '0') + ' - ' + (job.ageMax || '99') + ' yrs';
        }

        var skills = Array.isArray(job.skillsRequired) ? job.skillsRequired : [];

        var card = document.createElement('div');
        card.className = 'gs-audition-card relative bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-500 p-6 sm:p-8 flex flex-col opacity-0';

        card.innerHTML =
          '<div class="flex items-start gap-4 mb-5">' +
            (logoUrl
              ? '<img src="' + logoUrl + '" alt="' + companyName + '" class="w-12 h-12 rounded-xl object-cover flex-shrink-0 border border-slate-100" onerror="this.style.display=\'none\'">'
              : '<div class="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center text-purple-700 font-bold text-lg flex-shrink-0">' + (companyName ? companyName.charAt(0) : 'C') + '</div>') +
            '<div class="flex-1 min-w-0">' +
              '<h3 class="text-lg font-bold text-slate-900 truncate">' + (job.title || 'Untitled') + '</h3>' +
              (companyName ? '<p class="text-sm text-slate-500 truncate">' + companyName + '</p>' : '') +
            '</div>' +
          '</div>' +

          '<div class="flex flex-wrap gap-2 mb-4">' +
            (job.category ? '<span class="text-[11px] font-semibold text-purple-600 bg-purple-50 px-3 py-1 rounded-full">' + job.category + '</span>' : '') +
            (workMode ? '<span class="text-[11px] font-semibold text-slate-600 bg-slate-100 px-3 py-1 rounded-full">' + workMode + '</span>' : '') +
            (job.jobType ? '<span class="text-[11px] font-semibold text-slate-600 bg-slate-100 px-3 py-1 rounded-full">' + job.jobType.charAt(0).toUpperCase() + job.jobType.slice(1) + '</span>' : '') +
            (job.vacancies ? '<span class="text-[11px] font-semibold text-slate-600 bg-slate-100 px-3 py-1 rounded-full">' + job.vacancies + ' openings</span>' : '') +
          '</div>' +

          '<div class="space-y-2 text-sm text-slate-600 mb-5 flex-1">' +
            (location ? '<div class="flex items-center gap-2"><svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span>' + location + '</span></div>' : '') +
            (budgetLabel ? '<div class="flex items-center gap-2"><svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>' + budgetLabel + '</span></div>' : '') +
            (ageRange ? '<div class="flex items-center gap-2"><svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/></svg><span>' + ageRange + '</span></div>' : '') +
            (job.applicationCount !== undefined ? '<div class="flex items-center gap-2"><svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>' + job.applicationCount + ' applicant' + (job.applicationCount !== 1 ? 's' : '') + '</span></div>' : '') +
          '</div>' +

          '<div class="flex gap-2 pt-4 border-t border-slate-100">' +
            '<a href="https://castiva.in" target="_blank" class="flex-1 text-center py-2.5 rounded-xl font-bold text-sm bg-purple-600 hover:bg-purple-700 text-white transition-colors">Apply Now</a>' +
          '</div>';

        return card;
      }

      fetch(apiBase + '/jobs')
        .then(function(res) { return res.json(); })
        .then(function(json) {
          var jobs = json.data || [];
          if (!Array.isArray(jobs) || jobs.length === 0) {
            loading.style.display = 'none';
            emptyEl.classList.remove('hidden');
            return;
          }
          loading.style.display = 'none';
          jobs.forEach(function(job) {
            grid.appendChild(buildCard(job));
          });
          grid.classList.remove('hidden');

          requestAnimationFrame(function() {
            if (window.gsap && window.ScrollTrigger) {
              gsap.registerPlugin(ScrollTrigger);
              ScrollTrigger.refresh();
              gsap.fromTo('.gs-audition-card',
                { opacity: 0, y: 40, filter: 'blur(4px)' },
                { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, stagger: 0.12, ease: 'power2.out', scrollTrigger: { trigger: '#auditions-grid', start: 'top 85%' } }
              );
            } else {
              document.querySelectorAll('.gs-audition-card').forEach(function(c) { c.style.opacity = '1'; });
            }
          });
        })
        .catch(function(err) {
          console.error('Auditions fetch error:', err);
          loading.style.display = 'none';
          errorEl.classList.remove('hidden');
        });
    })();
  </script>

  <script>
    if (window.gsap) {
      gsap.fromTo('.gs-hero-reveal',
        { opacity: 0, y: 35, filter: 'blur(12px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1, stagger: 0.2, ease: 'power3.out', delay: 0.3 }
      );
    }
  </script>
</body>
</html>
