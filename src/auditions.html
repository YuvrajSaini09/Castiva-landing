<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castiva - Auditions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            castiva: {
              purple: '#A128FF',
              lightPurple: '#C86BFF',
              dark: '#111827',
              gray: '#4B5563',
              lightBg: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      color: #111827;
      overflow-x: hidden;
    }
    .scribble-underline {
      position: relative;
      display: inline-block;
    }
    .scribble-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -12px;
      width: 100%;
      height: 16px;
      background-image: url('sketch-line.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    .btn-login-gradient {
      background: linear-gradient(135deg, #A833FF 0%, #7C00FF 100%);
      box-shadow: 0 4px 15px rgba(168, 51, 255, 0.35);
    }
    .btn-login-gradient:hover {
      background: linear-gradient(135deg, #B54CFF 0%, #8D1AFF 100%);
      box-shadow: 0 6px 20px rgba(168, 51, 255, 0.5);
    }
    <!-- @import "../components/header/header.css" -->
    <!-- @import "../components/scrolling-banner/scrolling-banner.css" -->
  </style>
</head>
<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">
  <!-- @import "../components/header/header.html" -->
  <section class="pt-36 pb-32 flex flex-col items-center text-center relative overflow-hidden bg-cover bg-top text-slate-900" style="background-image: url('hero-gradient-small.png');">
    <div class="absolute top-10 left-1/4 w-72 h-72 bg-purple-300/20 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-indigo-300/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 right-1/3 w-48 h-48 bg-pink-300/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="max-w-7xl mx-auto px-6 relative z-10 text-center space-y-6">
      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-[1.15]">
        <span class="gs-hero-reveal inline-block">Open</span>
        <span class="gs-hero-reveal font-serif italic font-medium text-purple-600 text-5xl sm:text-7xl scribble-underline inline-block" style="--gs-delay: 0.15s">Auditions</span>
      </h1>
      <p class="gs-hero-reveal text-slate-600 max-w-2xl mx-auto text-sm sm:text-lg" style="--gs-delay: 0.3s">Browse live audition opportunities and take the next step in your casting career.</p>
    </div>
  </section>
  <!-- @import "../components/scrolling-banner/scrolling-banner.html" -->
  <section class="py-16 sm:py-20 px-6 max-w-6xl mx-auto">
    <div id="auditions-loading" class="text-center py-20">
      <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
      <p class="text-slate-500 mt-4">Loading auditions...</p>
    </div>
    <div id="auditions-error" class="text-center py-16 hidden">
      <p class="text-slate-500">Failed to load auditions.</p>
      <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors text-sm">Retry</button>
    </div>
    <div id="auditions-empty" class="text-center py-16 hidden">
      <p class="text-slate-500">No live auditions available right now. Check back soon.</p>
    </div>
    <div id="auditions-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>
  <!-- @import "../components/footer/footer.html" -->
  <script>
    <!-- @import "../components/header/header.js" -->
  </script>
  <script>
    <!-- @import "../components/scrolling-banner/scrolling-banner.js" -->
  </script>
  <script>
    (function() {
      var apiBase = 'https://backend.castiva.in/api/v1';
      var loading = document.getElementById('auditions-loading');
      var errorEl = document.getElementById('auditions-error');
      var emptyEl = document.getElementById('auditions-empty');
      var grid = document.getElementById('auditions-grid');

      function formatPaise(paise) {
        if (!paise) return null;
        var num = paise / 100;
        if (num >= 1000) {
          return '\u20B9' + num.toLocaleString('en-IN');
        }
        return '\u20B9' + num;
      }

      function buildCard(job) {
        var recruiter = job.recruiter?.recruiterProfile;
        var companyName = recruiter?.companyName || '';
        var logoUrl = recruiter?.companyLogoUrl || '';
        var coverImage = job.coverImageUrl || logoUrl || '';
        var city = job.locationCity || '';
        var state = job.locationState || '';
        var location = city + (city && state ? ', ' : '') + state;
        var workMode = job.workMode ? job.workMode.charAt(0).toUpperCase() + job.workMode.slice(1) : '';
        var isNegotiable = job.budgetType === 'negotiable';
        var budgetValue = '';
        if (job.budgetMinPaise || job.budgetMaxPaise) {
          var min = formatPaise(job.budgetMinPaise);
          var max = formatPaise(job.budgetMaxPaise);
          budgetValue = (min || '') + ' - ' + (max || '');
        } else if (isNegotiable) {
          budgetValue = 'Negotiable';
        }

        var ageRange = '';
        if (job.ageMin || job.ageMax) {
          ageRange = (job.ageMin || '0') + ' - ' + (job.ageMax || '99') + ' yrs';
        }

        var skills = Array.isArray(job.skillsRequired) ? job.skillsRequired : [];

        var subtitle = '';
        var jobTypeLabel = job.jobType ? job.jobType.charAt(0).toUpperCase() + job.jobType.slice(1) : '';
        var categoryLabel = job.category ? job.category.charAt(0).toUpperCase() + job.category.slice(1) : '';
        if (categoryLabel && jobTypeLabel) {
          subtitle = categoryLabel + ' \u00B7 ' + jobTypeLabel;
        } else {
          subtitle = categoryLabel || jobTypeLabel;
        }

        var card = document.createElement('div');
        card.className = 'gs-audition-card relative overflow-hidden rounded-[24px] bg-white text-slate-900 border border-purple-100 shadow-[0_10px_40px_rgba(168,51,255,0.12)] hover:shadow-[0_20px_60px_rgba(124,0,255,0.2)] hover:-translate-y-1 transition-all duration-500 p-6 sm:p-7 flex flex-col opacity-0';

        card.innerHTML =
          '<div class="absolute -top-12 -right-12 w-44 h-44 bg-purple-300/80 rounded-full blur-3xl pointer-events-none"></div>' +
          '<div class="absolute -bottom-16 -left-10 w-56 h-56 bg-purple-400/20 rounded-full blur-3xl pointer-events-none"></div>' +
          '<div class="absolute top-1/2 left-1/3 w-32 h-32 bg-fuchsia-300/60 rounded-full blur-3xl pointer-events-none"></div>' +
          '<div class="relative z-10 flex flex-col flex-1 min-w-0">' +

            '<div class="flex items-center justify-between gap-3">' +
              '<div class="text-sm font-semibold text-slate-700 truncate" style="opacity:.95;">' + (companyName || 'Castiva') + '</div>' +
              (workMode ? '<span class="inline-flex items-center text-[10px] sm:text-xs font-bold uppercase tracking-wider border border-purple-200 rounded-md px-2.5 py-1 text-purple-700 bg-purple-50/80 whitespace-nowrap" style="opacity:.95;">' + workMode + '</span>' : '') +
            '</div>' +

            '<div class="flex items-center gap-4 mt-4 ml-1.5">' +
              '<div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden flex-shrink-0">' +
                '<div class="absolute inset-0" style="background: linear-gradient(135deg, #A833FF 0%, #7C00FF 100%);"></div>' +
                (coverImage
                  ? '<img src="' + coverImage + '" alt="' + (job.title || 'Audition') + '" class="relative w-full h-full object-cover rounded-full" onerror="this.style.display=\'none\'">'
                  : '<div class="absolute inset-0 flex items-center justify-center"><svg class="w-7 h-7 text-white/70" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>') +
              '</div>' +
              '<div class="min-w-0 flex-1">' +
                '<h2 class="text-xl sm:text-2xl font-bold tracking-tight leading-tight text-slate-900">' + (job.title || 'Untitled') + '</h2>' +
                (subtitle ? '<p class="text-sm text-slate-500 mt-1">' + subtitle + '</p>' : '') +
              '</div>' +
            '</div>' +

            '<ul class="mt-4 space-y-2.5 text-sm flex-1">' +
              (location ? '<li class="flex items-center gap-2.5"><img src="icons/recruiter-icons/location.png" alt="Location" class="w-5 h-5 object-contain flex-shrink-0"><span class="text-slate-900 font-medium">' + location + '</span></li>' : '') +
              (ageRange ? '<li class="flex items-center gap-2.5"><img src="icons/recruiter-icons/search-filter.png" alt="Age" class="w-5 h-5 object-contain flex-shrink-0"><span class="text-slate-900 font-medium">Age ' + ageRange + '</span></li>' : '') +
              (job.vacancies ? '<li class="flex items-center gap-2.5"><img src="icons/howitworks-talent/dream-job.png" alt="Openings" class="w-5 h-5 object-contain flex-shrink-0"><span class="text-slate-900 font-medium">' + job.vacancies + ' opening' + (job.vacancies !== 1 ? 's' : '') + '</span></li>' : '') +
              (job.applicationCount !== undefined ? '<li class="flex items-center gap-2.5"><img src="icons/howitworks-talent/verified.png" alt="Applicants" class="w-5 h-5 object-contain flex-shrink-0"><span class="text-slate-900 font-medium">' + job.applicationCount + ' applicant' + (job.applicationCount !== 1 ? 's' : '') + '</span></li>' : '') +
              (isNegotiable ? '<li class="flex items-center gap-2.5"><img src="icons/recruiter-icons/cost-effective.png" alt="Negotiable" class="w-5 h-5 object-contain flex-shrink-0"><span class="text-slate-900 font-medium">Negotiable</span></li>' : '') +
            '</ul>' +

            '<div class="mt-4 flex items-center justify-between gap-3">' +
              (budgetValue ? '<div class="flex items-center gap-2 min-w-0 ml-1">' +
                '<span class="text-lg sm:text-xl font-bold tracking-tight truncate text-slate-900">' + budgetValue + '</span>' +
              '</div>' : '') +
              '<a href="https://castiva.in" target="_blank" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl text-sm text-white shadow-sm transition-all" style="background: linear-gradient(135deg, #A833FF 0%, #7C00FF 100%); box-shadow: 0 4px 15px rgba(168, 51, 255, 0.35);">Apply Now</a>' +
            '</div>' +

          '</div>';

        return card;
      }

      fetch(apiBase + '/jobs')
        .then(function(res) { return res.json(); })
        .then(function(json) {
          var jobs = json.data || [];
          if (!Array.isArray(jobs) || jobs.length === 0) {
            loading.style.display = 'none';
            emptyEl.classList.remove('hidden');
            return;
          }
          loading.style.display = 'none';
          jobs.forEach(function(job) {
            grid.appendChild(buildCard(job));
          });
          grid.classList.remove('hidden');

          requestAnimationFrame(function() {
            if (window.gsap && window.ScrollTrigger) {
              gsap.registerPlugin(ScrollTrigger);
              ScrollTrigger.refresh();
              gsap.fromTo('.gs-audition-card',
                { opacity: 0, y: 40, filter: 'blur(4px)' },
                { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, stagger: 0.12, ease: 'power2.out', scrollTrigger: { trigger: '#auditions-grid', start: 'top 85%' } }
              );
            } else {
              document.querySelectorAll('.gs-audition-card').forEach(function(c) { c.style.opacity = '1'; });
            }
          });
        })
        .catch(function(err) {
          console.error('Auditions fetch error:', err);
          loading.style.display = 'none';
          errorEl.classList.remove('hidden');
        });
    })();
  </script>

  <script>
    if (window.gsap) {
      gsap.fromTo('.gs-hero-reveal',
        { opacity: 0, y: 35, filter: 'blur(12px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1, stagger: 0.2, ease: 'power3.out', delay: 0.3 }
      );
    }
  </script>
</body>
</html>
