<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castiva - Legal</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            castiva: {
              purple: '#A128FF',
              lightPurple: '#C86BFF',
              dark: '#111827',
              gray: '#4B5563',
              lightBg: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #fbfbfe;
      min-height: 100vh;
      color: #111827;
      overflow-x: hidden;
    }
    
    .scribble-underline {
      position: relative;
      display: inline-block;
    }
    
    .scribble-underline::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -12px;
      width: 100%;
      height: 16px;
      background-image: url('sketch-line.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    
    .btn-login-gradient {
      background: linear-gradient(135deg, #A833FF 0%, #7C00FF 100%);
      box-shadow: 0 4px 15px rgba(168, 51, 255, 0.35);
    }
    
    .btn-login-gradient:hover {
      background: linear-gradient(135deg, #B54CFF 0%, #8D1AFF 100%);
      box-shadow: 0 6px 20px rgba(168, 51, 255, 0.5);
    }

    .legal-content h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.75rem;
    }
    .legal-content h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
    }
    .legal-content p, .legal-content ul {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.625;
      margin-bottom: 1.25rem;
    }
    .legal-content ul {
      list-style-type: disc;
      padding-left: 1.5rem;
    }
    .legal-content li {
      margin-bottom: 0.5rem;
    }

    /* Header Styles */
    <!-- @import "../components/header/header.css" -->

    /* Legal Tabs Component Styles */
    <!-- @import "../components/legal-tabs/legal-tabs.css" -->

    /* Scrolling Banner Styles */
    <!-- @import "../components/scrolling-banner/scrolling-banner.css" -->
  </style>
</head>
<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">

  <!-- Shared Header Component -->
  <!-- @import "../components/header/header.html" -->
  
  <!-- Hero Section -->
  <section class="pt-36 pb-32 flex flex-col items-center text-center relative overflow-hidden bg-cover bg-top text-slate-900" style="background-image: url('hero-gradient-small.png');">
    <div class="max-w-7xl mx-auto px-6 relative z-10 text-center">
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-3">
        Legal <span class="font-serif italic font-medium text-purple-600 text-[1.1em] scribble-underline inline-block">Pages</span>
      </h1>
      <p class="text-slate-600 max-w-xl mx-auto text-sm sm:text-base">Please review our rules, guidelines, and policies governing the Castiva global ecosystem.</p>
    </div>
  </section>

  <!-- @import "../components/scrolling-banner/scrolling-banner.html" -->

  <!-- Legal Tabs Selector (Full Width) -->
  <div class="w-full px-0">
    <!-- @import "../components/legal-tabs/legal-tabs.html" -->
  </div>

  <!-- Legal Main Content -->
  <section class="pt-6 md:pt-12 pb-16 px-6 max-w-4xl mx-auto">

    <!-- Content Area -->
    <div id="legal-loading" class="text-center py-20">
      <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
      <p class="text-slate-500 mt-4">Loading policies...</p>
    </div>
    <div id="legal-error" class="text-center py-16 hidden">
      <p class="text-slate-500">Failed to load policies.</p>
      <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors text-sm">Retry</button>
    </div>
    <div id="legal-content-area" class="bg-white p-8 sm:p-10 rounded-3xl border border-slate-100 shadow-sm legal-content  hidden"></div>
  </section>

  <!-- Shared Footer Component -->
  <!-- @import "../components/footer/footer.html" -->

  <!-- Header Script -->
  <script>
    <!-- @import "../components/header/header.js" -->
  </script>

  <!-- Scrolling Banner Script -->
  <script>
    <!-- @import "../components/scrolling-banner/scrolling-banner.js" -->
  </script>

  <!-- Policies Data Script -->
  <script>
    var legalApiBase = 'https://backend.castiva.in/api/v1';
    var legalData = [];

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'policy';
    }

    function renderTabsAndContent(policies) {
      var container = document.getElementById('legal-tab-container');
      var indicator = container.querySelector('.bento-tab-indicator');
      var contentArea = document.getElementById('legal-content-area');

      container.querySelectorAll('.bento-tab').forEach(function (t) { t.remove(); });
      contentArea.innerHTML = '';

      var tabs = [];
      policies.forEach(function (policy, i) {
        var tabId = policy.slug || slugify(policy.title);

        var btn = document.createElement('button');
        btn.className = 'bento-tab' + (i === 0 ? ' active' : '');
        btn.setAttribute('data-tab', tabId);
        btn.textContent = policy.title;
        container.appendChild(btn);

        var panel = document.createElement('div');
        panel.id = 'content-' + tabId;
        panel.className = 'tab-content' + (i === 0 ? ' block' : ' hidden');
        panel.innerHTML = policy.body || '';
        contentArea.appendChild(panel);

        tabs.push({ id: tabId, btn: btn });
      });

      var activeTab = tabs.length > 0 ? tabs[0].btn : null;
      var updateIndicator = function (tabEl) {
        if (!tabEl || !indicator) return;
        indicator.style.width = tabEl.offsetWidth + 'px';
        indicator.style.left = tabEl.offsetLeft + 'px';
      };

      tabs.forEach(function (t) {
        t.btn.addEventListener('click', function () {
          tabs.forEach(function (x) { x.btn.classList.remove('active'); });
          document.querySelectorAll('.tab-content').forEach(function (p) {
            p.classList.remove('block');
            p.classList.add('hidden');
          });
          t.btn.classList.add('active');
          var panel = document.getElementById('content-' + t.id);
          if (panel) {
            panel.classList.remove('hidden');
            panel.classList.add('block');
          }
          updateIndicator(t.btn);
        });
      });

      contentArea.classList.remove('hidden');

      setTimeout(function () {
        var urlParams = new URLSearchParams(window.location.search);
        var initial = urlParams.get('tab');
        if (initial) {
          var match = tabs.find(function (t) { return t.id === initial; });
          if (!match) {
            match = tabs.find(function (t) { return t.id.indexOf(initial) === 0; });
          }
          if (!match) {
            match = tabs.find(function (t) { return t.id.indexOf(initial) !== -1; });
          }
          if (match) {
            match.btn.click();
            return;
          }
        }
        updateIndicator(activeTab);
      }, 150);

      window.addEventListener('resize', function () {
        var act = container.querySelector('.bento-tab.active');
        if (act) updateIndicator(act);
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      var loading = document.getElementById('legal-loading');
      var errorEl = document.getElementById('legal-error');

      fetch(legalApiBase + '/pages?category=policy&_=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (!json.success || !Array.isArray(json.data)) {
            throw new Error('Invalid response');
          }
          legalData = json.data;
          loading.style.display = 'none';
          if (json.data.length === 0) {
            document.getElementById('legal-content-area').classList.remove('hidden');
            document.getElementById('legal-content-area').innerHTML = '<div class="text-center py-12"><p class="text-slate-500">No policies available at the moment.</p></div>';
            return;
          }
          renderTabsAndContent(json.data);
        })
        .catch(function (err) {
          console.error('Policies fetch error:', err);
          loading.style.display = 'none';
          errorEl.classList.remove('hidden');
        });
    });
  </script>
</body>
</html>
