<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">

  <!-- Shared Header Component -->
  <!-- @import "../components/header/header.html" -->
  
  <!-- Hero Section -->
  <section class="pt-36 pb-32 flex flex-col items-center text-center relative overflow-hidden bg-cover bg-top text-slate-900" style="background-image: url('hero-gradient-small.png');">
    <div class="max-w-7xl mx-auto px-6 relative z-10 text-center space-y-4">
      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight">
        Our <span class="font-serif italic font-medium text-purple-600 text-5xl sm:text-7xl scribble-underline">Blogs</span>
      </h1>
      <p class="text-slate-600 max-w-xl mx-auto text-sm sm:text-lg">Insights, tips, and stories from the forefront of talent discovery and casting innovation.</p>
    </div>
  </section>

  <!-- @import "../components/scrolling-banner/scrolling-banner.html" -->

  <!-- Blog Grid -->
  <section class="py-20 px-6 max-w-6xl mx-auto">
    <div id="blog-loading" class="text-center py-20">
      <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
      <p class="text-slate-500 mt-4">Loading articles...</p>
    </div>
    <div id="blog-error" class="text-center py-16 hidden">
      <p class="text-slate-500">Failed to load blog posts.</p>
      <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors text-sm">Retry</button>
    </div>
    <div id="blog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </section>

  <!-- Shared Footer Component -->
  <!-- @import "../components/footer/footer.html" -->

  <!-- Header Script -->
  <script>
    <!-- @import "../components/header/header.js" -->
  </script>

  <!-- Scrolling Banner Script -->
  <script>
    <!-- @import "../components/scrolling-banner/scrolling-banner.js" -->
  </script>

  <!-- Blog Data Script -->
  <script>
    var apiBase = 'https://backend.castiva.in/api/v1';
    var blogPosts = [];

    function renderMarkdown(md) {
      var html = md
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      var lines = html.split('\n');
      var out = [], inList = false, inOList = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var liMatch = line.match(/^[-*] (.+)/);
        var oliMatch = line.match(/^\d+\.\s+(.+)/);
        var isH = /^<h[123]>/.test(line);
        if (liMatch) {
          if (inOList) { out.push('</ol>'); inOList = false; }
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push('<li>' + liMatch[1] + '</li>');
        } else if (oliMatch) {
          if (inList) { out.push('</ul>'); inList = false; }
          if (!inOList) { out.push('<ol>'); inOList = true; }
          out.push('<li>' + oliMatch[1] + '</li>');
        } else if (isH) {
          if (inList) { out.push('</ul>'); inList = false; }
          if (inOList) { out.push('</ol>'); inOList = false; }
          out.push(line);
        } else if (line.trim() === '') {
          if (inList) { out.push('</ul>'); inList = false; }
          if (inOList) { out.push('</ol>'); inOList = false; }
        } else {
          if (inList) { out.push('</ul>'); inList = false; }
          if (inOList) { out.push('</ol>'); inOList = false; }
          out.push('<p>' + line + '</p>');
        }
      }
      if (inList) out.push('</ul>');
      if (inOList) out.push('</ol>');
      return out.join('\n');
    }

    function buildBlogCard(post) {
      var id = encodeURIComponent(post.slug || post._id);
      var card = document.createElement('a');
      card.href = 'blog-post.html?id=' + id;
      card.className = 'block bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden hover:shadow-md transition-all duration-300 group';

      var imgWrapper = document.createElement('div');
      imgWrapper.className = 'aspect-[2/1] bg-slate-100 overflow-hidden';

      if (post.coverImageUrl) {
        var img = document.createElement('img');
        img.className = 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-500';
        img.src = post.coverImageUrl;
        img.alt = post.title;
        img.loading = 'lazy';
        img.onerror = function () {
          this.style.display = 'none';
        };
        imgWrapper.appendChild(img);
      }

      var body = document.createElement('div');
      body.className = 'p-6 space-y-3 rounded-t-[2.5rem] -mt-8 relative z-10 bg-white';

      if (post.tags && post.tags.length > 0) {
        var tagRow = document.createElement('div');
        tagRow.className = 'flex flex-wrap gap-2';
        post.tags.slice(0, 3).forEach(function (tag) {
          var tagEl = document.createElement('span');
          tagEl.className = 'text-xs font-semibold text-purple-600 bg-purple-50 px-2.5 py-1 rounded-full';
          tagEl.textContent = tag;
          tagRow.appendChild(tagEl);
        });
        body.appendChild(tagRow);
      }

      var titleEl = document.createElement('h3');
      titleEl.className = 'font-bold text-slate-900 text-lg leading-snug group-hover:text-purple-600 transition-colors';
      titleEl.textContent = post.title;
      body.appendChild(titleEl);

      if (post.excerpt) {
        var excerptEl = document.createElement('p');
        excerptEl.className = 'text-slate-500 text-sm leading-relaxed line-clamp-3';
        excerptEl.textContent = post.excerpt;
        body.appendChild(excerptEl);
      }

      var dateEl = document.createElement('p');
      dateEl.className = 'text-xs text-slate-400 font-medium';
      if (post.publishedAt) {
        var d = new Date(post.publishedAt);
        dateEl.textContent = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      }
      body.appendChild(dateEl);

      card.appendChild(imgWrapper);
      card.appendChild(body);

      return card;
    }

    document.addEventListener('DOMContentLoaded', function () {
      var loading = document.getElementById('blog-loading');
      var errorEl = document.getElementById('blog-error');
      var grid = document.getElementById('blog-grid');

      if (!grid) return;

      fetch(apiBase + '/blog?_=' + Date.now())
        .then(function (res) { return res.json(); })
        .then(function (json) {
          if (!json.success || !Array.isArray(json.data)) {
            throw new Error('Invalid response');
          }

          var items = json.data.filter(function (p) { return p.status === 'published'; });
          blogPosts = items;

          if (items.length === 0) {
            loading.style.display = 'none';
            grid.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-slate-500">No articles published yet.</p></div>';
            return;
          }

          items.forEach(function (post) {
            grid.appendChild(buildBlogCard(post));
          });

          loading.style.display = 'none';
        })
        .catch(function (err) {
          console.error('Blog fetch error:', err);
          loading.style.display = 'none';
          errorEl.classList.remove('hidden');
        });
    });
  </script>
</body>
