<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castiva - Page</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
            playfair: ['"Playfair Display"', 'serif'],
          },
          colors: {
            castiva: { purple: '#A128FF', lightPurple: '#C86BFF', dark: '#111827', gray: '#4B5563', lightBg: '#FFFFFF' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #ffffff; min-height: 100vh; color: #111827; overflow-x: hidden; }
    .blog-content h1 { font-size: 1.75rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #0f172a; }
    .blog-content h2 { font-size: 1.375rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #0f172a; }
    .blog-content h3 { font-size: 1.125rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #0f172a; }
    .blog-content p { margin-bottom: 1rem; line-height: 1.75; color: #334155; }
    .blog-content ul, .blog-content ol { margin-bottom: 1rem; padding-left: 1.5rem; }
    .blog-content li { margin-bottom: 0.375rem; line-height: 1.7; color: #334155; }
    .blog-content strong { font-weight: 700; color: #0f172a; }
    .blog-content blockquote { border-left: 4px solid #a128ff; padding-left: 1rem; margin: 1rem 0; color: #475569; font-style: italic; }
    <!-- @import "../components/header/header.css" -->
  </style>
</head>
<body class="antialiased text-gray-900 bg-white selection:bg-purple-600 selection:text-white">

  <!-- @import "../components/header/header.html" -->

  <!-- Loading & Error -->
  <section class="pt-14 px-6 max-w-3xl mx-auto">
    <div id="page-post-loading" class="text-center py-20">
      <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
      <p class="text-slate-500 mt-4">Loading...</p>
    </div>
    <div id="page-post-error" class="text-center py-16 hidden">
      <p class="text-slate-500">Failed to load page.</p>
      <a id="page-post-error-back" href="#" class="mt-4 inline-block px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors text-sm">Back</a>
    </div>
  </section>

  <!-- Page Content -->
  <article id="page-post-article" class="hidden pt-14">
    <div id="page-post-cover-wrap" class="w-full max-h-[400px] overflow-hidden bg-slate-100 relative">
      <a id="page-post-back" href="#" class="absolute top-4 left-4 z-10 inline-flex items-center gap-1.5 text-xs text-slate-600 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full hover:bg-white transition-colors font-medium shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Back
      </a>
      <img id="page-post-cover" class="w-full h-full object-cover" src="" alt="">
    </div>
    <div class="max-w-3xl mx-auto px-6 py-10">
      <h1 id="page-post-title" class="text-2xl sm:text-4xl font-extrabold text-slate-900 leading-tight mb-3"></h1>
      <p id="page-post-date" class="text-sm text-slate-400 font-medium mb-8"></p>
      <div id="page-post-content" class="blog-content"></div>
    </div>
  </article>

  <!-- @import "../components/footer/footer.html" -->

  <script>
    <!-- @import "../components/header/header.js" -->
  </script>

  <script>
    var apiBase = 'https://backend.castiva.in/api/v1';

    document.addEventListener('DOMContentLoaded', function () {
      var loading = document.getElementById('page-post-loading');
      var errorEl = document.getElementById('page-post-error');
      var article = document.getElementById('page-post-article');

      var params = new URLSearchParams(window.location.search);
      var slug = params.get('slug');
      var category = params.get('category') || '';

      var backUrl = category ? (category + '.html') : 'index.html';
      document.getElementById('page-post-back').href = backUrl;
      document.getElementById('page-post-error-back').href = backUrl;

      if (!slug) {
        loading.style.display = 'none';
        errorEl.classList.remove('hidden');
        errorEl.querySelector('p').textContent = 'No page specified.';
        return;
      }

      fetch(apiBase + '/pages/' + encodeURIComponent(slug) + '?_=' + Date.now())
        .then(function (res) { return res.json(); })
        .then(function (json) {
          if (!json.success || !json.data) throw new Error('Invalid response');
          var page = json.data;

          document.title = page.title + ' - Castiva';

          var cover = document.getElementById('page-post-cover');
          if (page.imageUrl) {
            cover.src = page.imageUrl;
            cover.alt = page.title;
          } else {
            document.getElementById('page-post-cover-wrap').style.display = 'none';
          }

          document.getElementById('page-post-title').textContent = page.title;

          if (page.publishedAt) {
            var d = new Date(page.publishedAt);
            document.getElementById('page-post-date').textContent = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          }

          document.getElementById('page-post-content').innerHTML = page.body || '';

          loading.style.display = 'none';
          article.classList.remove('hidden');
        })
        .catch(function (err) {
          console.error('Page fetch error:', err);
          loading.style.display = 'none';
          errorEl.classList.remove('hidden');
        });
    });
  </script>
</body>
</html>
