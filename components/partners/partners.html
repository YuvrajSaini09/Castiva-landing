<!-- Our Exclusive Partners Section -->
<section id="partners-section" class="relative overflow-hidden py-20 bg-white w-full">
  <div class="max-w-[1400px] mx-auto px-6 mb-12 text-center">
    <h2 class="text-3xl sm:text-5xl md:text-6xl font-extrabold text-slate-900 tracking-tight mb-4">
      Our <span class="font-serif italic font-normal text-castiva-purple text-[1.15em] scribble-underline inline-block">Exclusive</span> Partners
    </h2>
  </div>

  <div class="flex justify-center mb-6">
    <div class="bento-tab-scroll-wrapper">
      <div class="bento-tab-container" style="width: 580px; max-width: 90%;">
        <div class="bento-tab-indicator" id="partners-tab-indicator" style="transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1);"></div>
        <button class="bento-tab active" data-category="talent">Talent</button>
        <button class="bento-tab" data-category="recruiter">Recruiter</button>
        <button class="bento-tab" data-category="celebrities">Celebrities</button>
      </div>
    </div>
  </div>

  <div id="partners-subcategories" class="hidden mb-4 w-full">
    <div id="partners-subcategories-scroll" class="flex gap-3 overflow-x-auto px-2 py-1" style="scrollbar-width: none; -ms-overflow-style: none; -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%); mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);"></div>
  </div>

  <div id="partners-loading" class="flex justify-center py-20">
    <div class="flex items-center gap-3 text-slate-500">
      <svg class="animate-spin h-6 w-6 text-purple-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-base font-medium">Loading partners...</span>
    </div>
  </div>

  <div id="partners-content" class="space-y-6 hidden">
    <div class="w-full overflow-hidden select-none relative z-10">
      <div id="partners-marquee-left" class="animate-marquee-left whitespace-nowrap flex gap-6"></div>
    </div>
    <div class="w-full overflow-hidden select-none relative z-10">
      <div id="partners-marquee-right" class="animate-marquee-right whitespace-nowrap flex gap-6"></div>
    </div>
  </div>

  <div id="partners-error" class="hidden text-center py-20">
    <p class="text-slate-500 text-base">Unable to load partners at this time.</p>
    <button onclick="initPartners()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors">Retry</button>
  </div>
</section>
