<header class="pt-6 px-4 fixed top-0 left-0 right-0 z-50 transition-all duration-300">
  <nav class="max-w-4xl mx-auto relative p-[1px] rounded-full overflow-hidden bg-slate-200/40 shadow-sm">
    <!-- Infinite Revolving Purple Beam -->
    <div class="border-beam-bg"></div>
    
    <!-- Navigation Inner Content Wrapper -->
    <div class="w-full relative z-10 bg-white/95 backdrop-blur-md rounded-full px-4 sm:px-6 py-2.5 flex items-center justify-between">
      <!-- Logo -->
      <a href="index.html" class="flex items-center group">
        <div class="w-[112px] h-10 overflow-hidden group-hover:scale-105 transition-transform bg-transparent flex items-center">
          <img src="logo.png" alt="Castiva logo" class="w-full h-full object-contain">
        </div>
      </a>

      <!-- Menu Items (Desktop) -->
      <div class="hidden md:flex items-center gap-8 font-semibold text-slate-700 text-sm">
        <a href="index.html" class="hover:text-purple-600 transition-colors">Home</a>
        <a href="about.html" class="hover:text-purple-600 transition-colors">About</a>
        <a href="contact.html" class="hover:text-purple-600 transition-colors">Contact</a>
        <a href="team.html" class="hover:text-purple-600 transition-colors">Team</a>
        <a href="blog.html" class="hover:text-purple-600 transition-colors">Blog</a>
        <a href="faq.html" class="hover:text-purple-600 transition-colors">FAQ</a>
      </div>

      <!-- Right: Login Button + Hamburger -->
      <div class="flex items-center gap-2">
        <!-- Login Button -->
        <div class="relative">
          <a href="https://castiva.in" target="_blank" class="block rounded-full">
            <button class="group overflow-hidden transition-all duration-700 ease-out hover:scale-[1.03] border-none flex cursor-pointer w-[90px] h-[38px] z-10 rounded-full relative items-center justify-center" style="filter: drop-shadow(0 8px 16px rgba(161,40,255,0.2)); background: #f8fafc">
              <!-- Volumetric Under-glow (Purple Theme) -->
              <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-[140%] h-32 bg-purple-500/30 blur-[60px] rounded-full opacity-60 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
              
              <!-- WebGL Core Container -->
              <div class="absolute inset-[2px] rounded-full overflow-hidden bg-white/5 backdrop-blur-xl border border-white/40 shadow-[inset_0_2px_12px_rgba(255,255,255,0.7)]">
                <canvas class="w-full h-full block" id="gl-aura-header" width="180" height="76"></canvas>
              </div>

              <!-- Glossy Glass Shell -->
              <div class="absolute inset-[2px] rounded-full overflow-hidden pointer-events-none">
                 <div class="absolute inset-0 bg-gradient-to-tr from-white/40 via-transparent to-white/10 opacity-70"></div>
                 <div class="absolute inset-0 rounded-full border border-white/90 shadow-[inset_0_4px_8px_rgba(255,255,255,0.4),inset_0_-4px_8px_rgba(0,0,0,0.15)]"></div>
              </div>

              <!-- Content Layer -->
              <div class="z-10 flex text-white px-3 relative drop-shadow-md items-center justify-center">
                <span class="text-sm font-medium tracking-tight whitespace-nowrap">Login</span>
              </div>
            </button>
          </a>
        </div>

        <!-- Hamburger Menu Icon (Mobile) -->
        <button id="mobile-menu-btn" class="md:hidden relative w-10 h-10 flex items-center justify-center" aria-label="Toggle menu">
          <div class="w-5 h-4 relative flex flex-col justify-between">
            <span class="menu-line block w-full h-[2px] bg-slate-700 rounded-full transition-all duration-300 origin-center"></span>
            <span class="menu-line block w-full h-[2px] bg-slate-700 rounded-full transition-all duration-300 origin-center"></span>
            <span class="menu-line block w-full h-[2px] bg-slate-700 rounded-full transition-all duration-300 origin-center"></span>
          </div>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Navigation Dropdown -->
  <div id="mobile-nav-modal" class="md:hidden fixed z-[60] pointer-events-none opacity-0 scale-95 transition-all duration-300 ease-out origin-top-right">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 py-5 px-6 w-[195px]">
      <div class="flex flex-col items-start gap-5 text-base font-semibold text-slate-700">
        <a href="index.html" class="mobile-nav-link hover:text-purple-600 transition-colors">Home</a>
        <a href="about.html" class="mobile-nav-link hover:text-purple-600 transition-colors">About</a>
        <a href="contact.html" class="mobile-nav-link hover:text-purple-600 transition-colors">Contact</a>
        <a href="team.html" class="mobile-nav-link hover:text-purple-600 transition-colors">Team</a>
        <a href="blog.html" class="mobile-nav-link hover:text-purple-600 transition-colors">Blog</a>
        <a href="faq.html" class="mobile-nav-link hover:text-purple-600 transition-colors">FAQ</a>
      </div>
    </div>
  </div>
</header>
