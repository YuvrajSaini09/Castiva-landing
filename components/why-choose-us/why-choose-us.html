<!-- Why Choose Us Section -->
<section class="why-choose-us-section py-20 px-6 bg-white" id="why-choose-us">
  <div class="max-w-7xl mx-auto">
    <!-- Heading -->
    <div class="text-center mb-12">
      <h2 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">
        Why <span class="font-playfair italic font-normal text-purple-600 scribble-underline inline-block text-6xl">Choose Us</span>?
      </h2>
      <p class="text-slate-500 text-base sm:text-lg max-w-xl mx-auto">Everything you need — whether you're a talent, recruiter, or brand.</p>
    </div>

    <!-- Tabs -->
    <div class="flex justify-center mb-10">
      <div class="bento-tab-container" style="width: 480px; max-width: 95%;">
        <div class="bento-tab-indicator" id="why-tab-indicator" style="transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1);"></div>
        <button class="bento-tab active" data-tab="talent" onclick="switchWhy('talent', this)">Talent</button>
        <button class="bento-tab" data-tab="recruiter" onclick="switchWhy('recruiter', this)">Recruiter</button>
        <button class="bento-tab" data-tab="digital" onclick="switchWhy('digital', this)">Digital Marketing</button>
      </div>
    </div>

    <!-- Talent Panel -->
    <div id="why-talent-panel" class="why-panel grid grid-cols-1 md:grid-cols-3 gap-6 opacity-100 block">
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
        <img src="Cards/Talent/1.png" alt="Verified Talent Community" class="w-full h-auto object-cover">
      </div>
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
        <img src="Cards/Talent/2.png" alt="Get Discovered Faster" class="w-full h-auto object-cover">
      </div>
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
        <img src="Cards/Talent/3.png" alt="Create. Showcase. Get Hired." class="w-full h-auto object-cover">
      </div>
    </div>

    <!-- Recruiter Panel -->
    <div id="why-recruiter-panel" class="why-panel grid grid-cols-1 md:grid-cols-3 gap-6 opacity-0 hidden">
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
        <img src="Cards/recruiter-tab/1.png" alt="Track Hiring Progress" class="w-full h-auto object-cover">
      </div>
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
        <img src="Cards/recruiter-tab/2.png" alt="Manage Talent Database" class="w-full h-auto object-cover">
      </div>
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
        <img src="Cards/recruiter-tab/3.png" alt="Advanced Talent Filters" class="w-full h-auto object-cover">
      </div>
    </div>

    <!-- Digital Marketing Panel -->
    <div id="why-digital-panel" class="why-panel grid grid-cols-1 md:grid-cols-3 gap-6 opacity-0 hidden">
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
        <img src="Cards/Digital marketing-tab/1.png" alt="Advertise to right audience" class="w-full h-auto object-cover">
      </div>
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer bg-[#1a0a2e]">
        <img src="Cards/Digital marketing-tab/1-L.png" alt="Smarter targeted campaigns" class="w-full h-auto object-contain">
      </div>
      <div class="rounded-3xl overflow-hidden shadow-lg hover:-translate-y-1 transition-transform duration-300 cursor-pointer">
        <img src="Cards/Digital marketing-tab/3.png" alt="Maximum your brand's reach" class="w-full h-auto object-cover">
      </div>
    </div>
  </div>
</section>
