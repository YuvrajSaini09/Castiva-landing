<!-- Who Is Castiva Built For Component -->
<section class="py-20 px-6 max-w-7xl mx-auto bg-white border-t border-slate-100" id="audience-section">
  <div class="text-center mb-10">
    <h2 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">
      Who Is <span class="font-playfair italic font-normal text-purple-600 scribble-underline inline-block text-6xl">Castiva</span> Built For?
    </h2>
  </div>

  <div class="flex justify-center pt-8 mb-12">
    <div class="bento-tab-container" style="width: 320px;">
      <div class="bento-tab-indicator" id="audience-tab-indicator"></div>
      <button class="bento-tab active" data-tab="talent" onclick="switchAudience('talent', this)">For Talent</button>
      <button class="bento-tab" data-tab="recruiter" onclick="switchAudience('recruiter', this)">For Recruiters</button>
    </div>
  </div>

  <div id="audience-loading" class="text-center py-20">
    <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
    <p class="text-slate-500 mt-4">Loading categories...</p>
  </div>

  <div id="talent-categories-panel" class="space-y-12 transition-all duration-500 opacity-0 hidden"></div>

  <div id="recruiter-categories-panel" class="space-y-12 transition-all duration-500 opacity-0 hidden"></div>

</section>
