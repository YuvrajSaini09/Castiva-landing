<!-- Infinite Scrolling Testimonials Section -->
<section class="pt-20 pb-8 overflow-hidden bg-slate-50/30 w-full relative">
  <div class="max-w-7xl mx-auto px-6 mb-12 text-center">
    <h2 class="text-3xl sm:text-5xl md:text-6xl font-extrabold text-slate-900 tracking-tight mb-4">
      Loved by the <span class="font-serif italic font-normal text-castiva-purple text-[1.15em] scribble-underline inline-block">Industry</span>
    </h2>
    <p class="text-slate-500 max-w-xl mx-auto text-sm sm:text-base">See how casting directors, creators, and actors are scaling their career with Castiva.</p>
  </div>

  <div id="testimonials-loading" class="text-center py-16">
    <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
    <p class="text-slate-500 mt-4">Loading testimonials...</p>
  </div>

  <div id="testimonials-error" class="text-center py-16 hidden">
    <p class="text-slate-500">Failed to load testimonials.</p>
    <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-full font-semibold hover:bg-purple-700 transition-colors text-sm">Retry</button>
  </div>

  <!-- Testimonials Infinite Banner Wrapper -->
  <div id="testimonials-wrapper" class="w-full overflow-hidden select-none relative z-10 py-2" style="display:none">
    <div id="testimonials-track" class="whitespace-nowrap flex gap-6"></div>
  </div>
  <div id="testimonials-wrapper-2" class="w-full overflow-hidden select-none relative z-10 py-2" style="display:none">
    <div id="testimonials-track-2" class="whitespace-nowrap flex gap-6"></div>
  </div>
</section>
